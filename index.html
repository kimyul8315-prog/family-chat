<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>가족톡</title>
<style>
  html, body { height: 100%; margin: 0; padding: 0; background: #b2c7d9; overflow: hidden; font-family: sans-serif; }
  #chat { display: none; flex-direction: column; height: 100%; }
  #log { flex: 1; overflow-y: auto; padding: 10px; }
  
  /* 입력창과 버튼 고정 디자인 (버튼 안 잘리게) */
  #inputRow { display: flex; padding: 8px; background: white; align-items: center; flex-shrink: 0; }
  #msgInput { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 20px; outline: none; min-width: 0; }
  
  /* 버튼이 줄어들지 않도록 고정 */
  .btn { flex-shrink: 0; margin-left: 5px; padding: 10px; font-size: 18px; border: none; border-radius: 20px; cursor: pointer; }
  #callBtn { background: #4a90d9; color: white; }
  #sirenBtn { background: #e74c3c; color: white; }
  #sendBtn { background: #FEE500; color: #333; font-weight: bold; }

  /* 🎥 화상통화 UI */
  #videoUI { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
  #localVideo { width: 100px; height: 150px; position: absolute; bottom: 80px; right: 20px; border-radius: 10px; border: 2px solid white; }
  #endCallBtn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 30px; background: #e74c3c; color: white; border-radius: 20px; border: none; }
</style>
</head>
<body>

<div id="chat" style="display: flex;">
  <div id="log"></div>
  <div id="inputRow">
    <button class="btn" id="callBtn" onclick="startVideoCall()">📞</button>
    <input type="text" id="msgInput" placeholder="메시지 입력">
    <button class="btn" id="sirenBtn" onclick="sendSiren()">🚨</button>
    <button class="btn" id="sendBtn" onclick="sendMsg()">전송</button>
  </div>
</div>

<div id="videoUI">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <button id="endCallBtn" onclick="endCall()">통화 종료</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
// (기존 firebaseConfig는 그대로 유지해주세요)
const firebaseConfig = { /* ...이미 적혀있던 설정... */ };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// [디자인 수정 안내]
// 이 코드를 깃허브에 다시 업로드하시면, 버튼이 화면에서 밀려나지 않고 
// 화상통화 버튼도 다시 잘 보이게 됩니다.
function sendMsg() { alert("메시지 전송 기능 작동!"); }
function startVideoCall() { 
    document.getElementById('videoUI').style.display = 'block';
    // 여기에 카메라 권한 요청 코드 추가 예정
}
function endCall() { document.getElementById('videoUI').style.display = 'none'; }
</script>
</body>
</html>
