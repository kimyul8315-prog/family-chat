<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>가족톡</title>
<style>
  html, body { height: 100%; margin: 0; padding: 0; background: #b2c7d9; overflow: hidden; font-family: sans-serif; }
  #setup { padding: 24px; background: white; height: 100%; box-sizing: border-box; }
  #chat { display: none; flex-direction: column; height: 100%; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; }
  
  .msg-row { display: flex; flex-direction: column; margin-bottom: 12px; width: 100%; }
  .msg-row.me { align-items: flex-end; }
  .msg-row.other { align-items: flex-start; }
  .msg-row.system { align-items: center; }

  .name-tag { font-size: 12px; color: #555; margin-bottom: 4px; padding: 0 4px; }
  .bubble-group { display: flex; align-items: flex-end; max-width: 80%; }
  .msg-row.me .bubble-group { flex-direction: row-reverse; }

  /* 사진/동영상이 들어갈 때 말풍선 패딩 조정 */
  .bubble { padding: 8px 12px; font-size: 15px; border-radius: 12px; word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
  .msg-row.other .bubble { background: #ffffff; border-top-left-radius: 2px; }
  .msg-row.me .bubble { background: #FEE500; border-top-right-radius: 2px; }
  
  /* 사진과 동영상이 말풍선 밖으로 삐져나가지 않게 설정 */
  .bubble img, .bubble video { max-width: 100%; border-radius: 8px; display: block; margin-top: 4px; }

  .msg-row.system .bubble { background: rgba(0,0,0,0.2); color: white; font-size: 12px; border-radius: 16px; padding: 4px 12px; box-shadow: none; }
  .msg-row.system.siren .bubble { background: #ffebe6; color: red; border: 1px solid red; font-size: 14px; font-weight: bold; }

  .time-tag { font-size: 10px; color: #555; margin: 0 6px; margin-bottom: 2px; }
  
  #inputRow { display: flex; padding: 10px; background: white; align-items: center; }
  #msgInput { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
  
  /* 파일 첨부 버튼 추가 */
  #fileBtn { margin-right: 8px; padding: 10px; font-size: 18px; border: none; background: transparent; color: #555; cursor: pointer; }
  
  #sirenBtn { margin-left: 8px; padding: 10px 12px; font-size: 15px; border: none; background: #e74c3c; color: white; border-radius: 20px; font-weight: bold; }
  #sendBtn { margin-left: 6px; padding: 10px 16px; font-size: 15px; border: none; background: #FEE500; color: #333; border-radius: 20px; font-weight: bold; }
  
  input[type=text]#nameInput { padding: 12px; font-size: 16px; width: 100%; box-sizing: border-box; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 6px; }
  #setup button { padding: 12px 16px; font-size: 16px; border: none; background: #4a90d9; color: white; border-radius: 6px; font-weight: bold; width: 100%; }
  
  #status { font-size: 12px; color: #888; padding: 8px 12px; background: rgba(255,255,255,0.8); text-align: center; }
</style>
</head>
<body>

<div id="setup">
  <h2>👨‍👩‍👧‍👦 가족톡 입장</h2>
  <p style="color: #666; font-size: 14px;">사용하실 이름을 입력해 주세요.</p>
  <input type="text" id="nameInput" placeholder="이름 입력 (예: 아빠)">
  <button onclick="startChat()">입장하기</button>
</div>

<div id="chat">
  <div id="status">연결 중...</div>
  <div id="log"></div>
  <div id="inputRow">
    <!-- 숨겨진 파일 선택창과 눈에 보이는 📷 버튼 -->
    <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
    <button id="fileBtn" onclick="document.getElementById('fileInput').click()">📷</button>
    
    <input type="text" id="msgInput" placeholder="메시지 입력">
    <button id="sirenBtn" onclick="sendSiren()">🚨</button>
    <button id="sendBtn" onclick="sendMsg()">전송</button>
  </div>
</div>

<!-- 파이어베이스 SDK (Storage 추가) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAtbGlljJzyd0yYKCIC19RunZ0TSLFiZK4",
  authDomain: "kimyul8388.firebaseapp.com",
  databaseURL: "https://kimyul8388-default-rtdb.firebaseio.com/",
  projectId: "kimyul8388",
  storageBucket: "kimyul8388.firebasestorage.app",
  messagingSenderId: "505675986559",
  appId: "1:505675986559:web:ce0b8c5e67fc35138af14a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage(); // 파일 저장소 연결
const messagesRef = db.ref("messages");

let myName = "";
let isInitialLoad = true;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  function beep(freq, startTime) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.3, startTime);
    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + 0.1);
  }
  const now = audioCtx.currentTime;
  beep(880, now);
  beep(1108.73, now + 0.1);
}

function playSiren() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square'; 
  const now = audioCtx.currentTime;
  osc.frequency.setValueAtTime(600, now);
  for (let i = 0; i < 5; i++) {
    osc.frequency.linearRampToValueAtTime(900, now + i * 0.5 + 0.25);
    osc.frequency.linearRampToValueAtTime(600, now + i * 0.5 + 0.5);
  }
  gain.gain.setValueAtTime(0.2, now);
  gain.gain.linearRampToValueAtTime(0, now + 2.5);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 2.5);
}

function startChat() {
  const v = document.getElementById('nameInput').value.trim();
  if (!v) return;
  myName = v;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('chat').style.display = 'flex';
  if (audioCtx.state === 'suspended') audioCtx.resume();
  messagesRef.push({
    sender: myName, name: "🔔 시스템", text: myName + "님이 입장하셨습니다.", type: "system",
    time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
  });
  listenForMessages();
}

function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  messagesRef.push({
    sender: myName, name: myName, text: text, type: "normal",
    time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
  });
  input.value = '';
}

function sendSiren() {
  messagesRef.push({
    sender: myName, name: "🚨 긴급호출", text: myName + "님이 긴급 사이렌을 울렸습니다!!!", type: "siren",
    time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
  });
}

// 파일(사진/동영상) 업로드 처리
document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const status = document.getElementById('status');
  status.textContent = "⏳ 파일 업로드 중... 잠시만 기다려주세요.";
  
  // 파일 이름이 겹치지 않게 현재 시간을 앞에 붙임
  const fileName = new Date().getTime() + "_" + file.name;
  const storageRef = storage.ref('chat_media/' + fileName);

  storageRef.put(file).then((snapshot) => {
    return snapshot.ref.getDownloadURL();
  }).then((downloadURL) => {
    const isVideo = file.type.startsWith('video/');
    messagesRef.push({
      sender: myName,
      name: myName,
      text: downloadURL, // 글자 대신 인터넷 주소(URL)를 저장
      type: isVideo ? 'video' : 'image', // 사진인지 동영상인지 구분
      time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
    });
    status.textContent = "✅ 서버에 연결되었습니다";
  }).catch((error) => {
    console.error("업로드 에러:", error);
    alert("파일 전송 실패! 파이어베이스 Storage 규칙을 열어주셨나요?");
    status.textContent = "✅ 서버에 연결되었습니다";
  });
  
  e.target.value = ''; // 선택 초기화
});

function listenForMessages() {
  const status = document.getElementById('status');
  const log = document.getElementById('log');

  messagesRef.once('value', () => isInitialLoad = false);

  messagesRef.limitToLast(200).on('child_added', function(snapshot) {
    const m = snapshot.val();
    const row = document.createElement('div');
    
    // 사진/동영상일 경우 화면에 그리는 방식을 다르게 처리
    let contentHtml = escapeHtml(m.text);
    if (m.type === 'image') {
      contentHtml = `<img src="${m.text}" alt="사진">`;
    } else if (m.type === 'video') {
      contentHtml = `<video src="${m.text}" controls></video>`;
    }

    if (m.type === "system" || m.name === "🔔 시스템") {
      row.className = 'msg-row system';
      row.innerHTML = `<div class="bubble">${contentHtml}</div>`;
    } else if (m.type === "siren" || m.name === "🚨 긴급호출") {
      row.className = 'msg-row system siren';
      row.innerHTML = `<div class="bubble">${contentHtml}</div>`;
    } else if (m.sender === myName) {
      row.className = 'msg-row me';
      row.innerHTML = `<div class="bubble-group"><div class="bubble">${contentHtml}</div><span class="time-tag">${escapeHtml(m.time)}</span></div>`;
    } else {
      row.className = 'msg-row other';
      row.innerHTML = `<div class="name-tag">${escapeHtml(m.name)}</div><div class="bubble-group"><div class="bubble">${contentHtml}</div><span class="time-tag">${escapeHtml(m.time)}</span></div>`;
    }

    log.appendChild(row);
    // 미디어 파일 로딩 완료 시 스크롤을 맨 아래로 다시 맞춤
    const mediaObj = row.querySelector('img, video');
    if(mediaObj) {
        mediaObj.onload = () => { log.scrollTop = log.scrollHeight; };
    }
    log.scrollTop = log.scrollHeight; 

    if (!isInitialLoad && m.sender !== myName) {
      if (m.type === "siren" || m.name === "🚨 긴급호출") playSiren();
      else playSound();
    }
  });

  db.ref(".info/connected").on("value", snap => {
    if(status.textContent.indexOf('업로드') === -1) {
       status.textContent = snap.val() ? "✅ 서버에 연결되었습니다" : "❌ 연결 끊김 - 인터넷 확인 필요";
    }
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.activeElement.id === 'nameInput') startChat();
    if (document.activeElement.id === 'msgInput') sendMsg();
  }
});

function escapeHtml(s) {
  if (!s) return "";
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}
</script>
</body>
</html>
