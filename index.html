<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>가족톡</title>
<style>
  html, body { height: 100%; margin: 0; padding: 0; background: #b2c7d9; overflow: hidden; font-family: sans-serif; }

  /* 🚪 로그인 화면 */
  #loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: #FEE500; }
  #loginScreen h2 { margin-bottom: 20px; color: #333; }
  #loginScreen input { padding: 15px; font-size: 18px; border-radius: 10px; border: 1px solid #ccc; margin-bottom: 15px; width: 220px; text-align: center; }
  #loginScreen button { padding: 15px 40px; font-size: 18px; border-radius: 10px; border: none; background: #333; color: white; cursor: pointer; font-weight: bold; }

  /* 💬 채팅 화면 */
  #chatScreen { display: none; flex-direction: column; height: 100%; }
  #log { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  
  .msg { padding: 10px 15px; border-radius: 15px; max-width: 70%; word-break: break-word; font-size: 16px; line-height: 1.4; }
  .my-msg { background: #FEE500; align-self: flex-end; border-top-right-radius: 0; }
  .other-msg { background: white; align-self: flex-start; border-top-left-radius: 0; }
  .sender { font-size: 12px; margin-bottom: 5px; color: #555; font-weight: bold; }
  .msg img { max-width: 100%; border-radius: 10px; margin-top: 5px; display: block; }

  /* ⌨️ 입력창 (버튼 안 잘리게) */
  #inputRow { display: flex; padding: 8px; background: white; align-items: center; flex-shrink: 0; gap: 5px; }
  #msgInput { flex: 1; padding: 12px; font-size: 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; min-width: 0; }
  .btn { flex-shrink: 0; padding: 10px 12px; font-size: 16px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
  
  #fileBtn { background: #e0e0e0; color: #333; }
  #callBtn { background: #4a90d9; color: white; }
  #sirenBtn { background: #e74c3c; color: white; }
  #sendBtn { background: #FEE500; color: #333; }

  /* 🎥 화상통화 화면 */
  #videoUI { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
  #localVideo { width: 120px; height: 160px; position: absolute; bottom: 80px; right: 20px; border-radius: 10px; border: 2px solid white; object-fit: cover; }
  #endCallBtn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 30px; background: #e74c3c; color: white; border-radius: 20px; border: none; font-size: 16px; font-weight: bold; }
  
  /* 전화 수신 알림창 */
  #incomingCall { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 1000; text-align: center; }
  #incomingCall button { margin: 5px; padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
  #acceptCallBtn { background: #2ecc71; color: white; }
  #rejectCallBtn { background: #e74c3c; color: white; }
</style>
</head>
<body>

<!-- 1. 입장 화면 -->
<div id="loginScreen">
  <h2>👨‍👩‍👧 가족톡</h2>
  <input type="text" id="usernameInput" placeholder="이름을 입력하세요">
  <button onclick="enterChat()">입장하기</button>
</div>

<!-- 전화 수신 알림창 -->
<div id="incomingCall">
  <p><b id="callerName">누군가</b>님이 화상통화를 요청합니다!</p>
  <button id="acceptCallBtn" onclick="acceptCall()">받기 📞</button>
  <button id="rejectCallBtn" onclick="rejectCall()">거절 ❌</button>
</div>

<!-- 2. 채팅 화면 -->
<div id="chatScreen">
  <div id="log"></div>
  <div id="inputRow">
    <!-- 숨겨진 파일 선택창과 사진/파일 첨부 버튼(📎) 복구 -->
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="sendFile(event)">
    <button class="btn" id="fileBtn" onclick="document.getElementById('fileInput').click()">📎</button>
    <button class="btn" id="callBtn" onclick="startVideoCall()">📞</button>
    <input type="text" id="msgInput" placeholder="메시지 입력" onkeypress="if(event.keyCode==13) sendMsg()">
    <button class="btn" id="sirenBtn" onclick="sendSiren()">🚨</button>
    <button class="btn" id="sendBtn" onclick="sendMsg()">전송</button>
  </div>
</div>

<!-- 3. 화상통화 화면 -->
<div id="videoUI">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <button id="endCallBtn" onclick="endCall()">통화 종료</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
// 파이어베이스 설정
const firebaseConfig = {
  apiKey: "AIzaSyAtbGlljJzyd0yYKCIC19RunZ0TSLFiZK4",
  authDomain: "kimyul8388.firebaseapp.com",
  databaseURL: "https://kimyul8388-default-rtdb.firebaseio.com/",
  projectId: "kimyul8388",
  storageBucket: "kimyul8388.firebasestorage.app",
  messagingSenderId: "505675986559",
  appId: "1:505675986559:web:ce0b8c5e67fc35138af14a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let myName = "";

// ---------------------------------------------------
// 1. 기본 채팅, 사이렌, 사진 전송 기능
// ---------------------------------------------------
function enterChat() {
  const nameInput = document.getElementById('usernameInput').value;
  if(nameInput.trim() === "") return alert("이름을 입력해주세요!");
  myName = nameInput;
  
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'flex';
  
  db.ref("messages").on("child_added", function(snapshot) {
    const data = snapshot.val();
    displayMessage(data.name, data.text, data.imageUrl);
  });

  listenForCall();
}

function sendMsg() {
  const textInput = document.getElementById('msgInput');
  if(textInput.value.trim() === "") return;
  db.ref("messages").push({ name: myName, text: textInput.value, timestamp: Date.now() });
  textInput.value = "";
}

function sendSiren() {
  db.ref("messages").push({
    name: "🚨 긴급",
    text: "🚨 " + myName + "님이 긴급 호출을 보냈습니다! 🚨",
    timestamp: Date.now()
  });
}

// [핵심 복구] 저장소(Storage) 결제 없이 사진 압축해서 바로 보내는 기능
function sendFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 800;
      const MAX_HEIGHT = 800;
      let width = img.width;
      let height = img.height;

      if (width > height) {
        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
      } else {
        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      
      // 이미지를 텍스트 데이터로 변환 (Storage 없이 전송 가능)
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

      db.ref("messages").push({
        name: myName,
        text: "",
        imageUrl: dataUrl,
        timestamp: Date.now()
      });
    }
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 메시지 화면에 출력하기 (사진 포함)
function displayMessage(name, text, imageUrl) {
  const log = document.getElementById('log');
  const msgDiv = document.createElement('div');
  
  if (name === "🚨 긴급") {
    msgDiv.className = 'msg';
    msgDiv.style.background = '#e74c3c';
    msgDiv.style.color = 'white';
    msgDiv.style.alignSelf = 'center';
  } else {
    msgDiv.className = 'msg ' + (name === myName ? 'my-msg' : 'other-msg');
  }
  
  if (name !== myName && name !== "🚨 긴급") {
    const nameDiv = document.createElement('div');
    nameDiv.className = 'sender';
    nameDiv.innerText = name;
    msgDiv.appendChild(nameDiv);
  }
  
  if (text) {
    const textDiv = document.createElement('div');
    textDiv.innerText = text;
    msgDiv.appendChild(textDiv);
  }

  // 받은 데이터에 사진이 있으면 말풍선 안에 사진 그리기
  if (imageUrl) {
    const imgElement = document.createElement('img');
    imgElement.src = imageUrl;
    msgDiv.appendChild(imgElement);
  }
  
  log.appendChild(msgDiv);
  log.scrollTop = log.scrollHeight;
}

// ---------------------------------------------------
// 2. 1:1 화상통화 (WebRTC + 파이어베이스 통신)
// ---------------------------------------------------
let localStream, peerConnection;
const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const callDoc = db.ref("call");

async function startVideoCall() { 
  try {
    localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
    document.getElementById('localVideo').srcObject = localStream;
    document.getElementById('videoUI').style.display = 'block';

    peerConnection = new RTCPeerConnection(servers);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.ontrack = event => { document.getElementById('remoteVideo').srcObject = event.streams[0]; };
    peerConnection.onicecandidate = event => {
      if(event.candidate) callDoc.child('offerCandidates').push(event.candidate.toJSON());
    };

    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    
    await callDoc.set({ offer: { type: offer.type, sdp: offer.sdp }, caller: myName });

    callDoc.child('answer').on('value', snapshot => {
      const answer = snapshot.val();
      if(answer && !peerConnection.currentRemoteDescription) {
        peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
      }
    });

    callDoc.child('answerCandidates').on('child_added', snapshot => {
      peerConnection.addIceCandidate(new RTCIceCandidate(snapshot.val()));
    });
  } catch (e) { alert("카메라 권한을 허용해 주세요."); }
}

function listenForCall() {
  callDoc.on('value', snapshot => {
    const data = snapshot.val();
    if(data && data.offer && data.caller !== myName && !peerConnection) {
      document.getElementById('callerName').innerText = data.caller;
      document.getElementById('incomingCall').style.display = 'block';
    }
    if(!data || data.endCall) {
      endCall(false);
    }
  });
}

async function acceptCall() {
  document.getElementById('incomingCall').style.display = 'none';
  const data = (await callDoc.once('value')).val();
  if(!data || !data.offer) return;

  localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
  document.getElementById('localVideo').srcObject = localStream;
  document.getElementById('videoUI').style.display = 'block';

  peerConnection = new RTCPeerConnection(servers);
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

  peerConnection.ontrack = event => { document.getElementById('remoteVideo').srcObject = event.streams[0]; };
  peerConnection.onicecandidate = event => {
    if(event.candidate) callDoc.child('answerCandidates').push(event.candidate.toJSON());
  };

  await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);

  await callDoc.child('answer').set({ type: answer.type, sdp: answer.sdp });

  callDoc.child('offerCandidates').on('child_added', snapshot => {
    peerConnection.addIceCandidate(new RTCIceCandidate(snapshot.val()));
  });
}

function rejectCall() {
  document.getElementById('incomingCall').style.display = 'none';
  callDoc.set({ endCall: true }); 
}

function endCall(isInitiator = true) {
  document.getElementById('videoUI').style.display = 'none';
  document.getElementById('incomingCall').style.display = 'none';
  if(localStream) localStream.getTracks().forEach(track => track.stop());
  if(peerConnection) {
      peerConnection.close();
      peerConnection = null;
  }
  if(isInitiator) callDoc.set({ endCall: true }); 
}
</script>
</body>
</html>
