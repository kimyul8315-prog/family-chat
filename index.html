<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>가족톡</title>
<style>
  html, body { height: 100%; margin: 0; padding: 0; background: #b2c7d9; overflow: hidden; font-family: sans-serif; }

  /* 🚪 로그인(입장) 화면 */
  #loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: #FEE500; }
  #loginScreen h2 { margin-bottom: 20px; color: #333; }
  #loginScreen input { padding: 15px; font-size: 18px; border-radius: 10px; border: 1px solid #ccc; margin-bottom: 15px; width: 220px; text-align: center; }
  #loginScreen button { padding: 15px 40px; font-size: 18px; border-radius: 10px; border: none; background: #333; color: white; cursor: pointer; font-weight: bold; }

  /* 💬 채팅 화면 */
  #chatScreen { display: none; flex-direction: column; height: 100%; }
  #log { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  
  /* 말풍선 디자인 */
  .msg { padding: 10px 15px; border-radius: 15px; max-width: 70%; word-break: break-word; font-size: 16px; line-height: 1.4; }
  .my-msg { background: #FEE500; align-self: flex-end; border-top-right-radius: 0; }
  .other-msg { background: white; align-self: flex-start; border-top-left-radius: 0; }
  .sender { font-size: 12px; margin-bottom: 5px; color: #555; font-weight: bold; }

  /* ⌨️ 입력창과 버튼 (안 잘리게 고정) */
  #inputRow { display: flex; padding: 10px; background: white; align-items: center; flex-shrink: 0; }
  #msgInput { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 20px; outline: none; min-width: 0; }
  .btn { flex-shrink: 0; margin-left: 8px; padding: 12px 15px; font-size: 16px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
  #callBtn { background: #4a90d9; color: white; }
  #sendBtn { background: #FEE500; color: #333; }

  /* 🎥 화상통화 UI */
  #videoUI { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
  #localVideo { width: 120px; height: 160px; position: absolute; bottom: 80px; right: 20px; border-radius: 10px; border: 2px solid white; object-fit: cover; }
  #endCallBtn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 30px; background: #e74c3c; color: white; border-radius: 20px; border: none; font-size: 16px; font-weight: bold; }
</style>
</head>
<body>

<!-- 1. 입장 화면 -->
<div id="loginScreen">
  <h2>👨‍👩‍👧 가족톡</h2>
  <input type="text" id="usernameInput" placeholder="이름을 입력하세요">
  <button onclick="enterChat()">입장하기</button>
</div>

<!-- 2. 채팅 화면 -->
<div id="chatScreen">
  <div id="log"></div>
  <div id="inputRow">
    <button class="btn" id="callBtn" onclick="startVideoCall()">📞</button>
    <input type="text" id="msgInput" placeholder="메시지 입력" onkeypress="if(event.keyCode==13) sendMsg()">
    <button class="btn" id="sendBtn" onclick="sendMsg()">전송</button>
  </div>
</div>

<!-- 3. 화상통화 화면 -->
<div id="videoUI">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <button id="endCallBtn" onclick="endCall()">통화 종료</button>
</div>

<!-- 파이어베이스 연결 스크립트 -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
// 파이어베이스 설정 (기존 정보 그대로 유지)
const firebaseConfig = {
  apiKey: "AIzaSyAtbGlljJzyd0yYKCIC19RunZ0TSLFiZK4",
  authDomain: "kimyul8388.firebaseapp.com",
  databaseURL: "https://kimyul8388-default-rtdb.firebaseio.com/",
  projectId: "kimyul8388",
  storageBucket: "kimyul8388.firebasestorage.app",
  messagingSenderId: "505675986559",
  appId: "1:505675986559:web:ce0b8c5e67fc35138af14a"
};

// 파이어베이스 초기화
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let myName = "";

// [기능 1] 입장하기
function enterChat() {
  const nameInput = document.getElementById('usernameInput').value;
  if(nameInput.trim() === "") {
    alert("이름을 입력해주세요!");
    return;
  }
  myName = nameInput;
  
  // 화면 전환
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'flex';
  
  // 파이어베이스에서 기존 메시지들 불러오기 및 대기
  db.ref("messages").on("child_added", function(snapshot) {
    const data = snapshot.val();
    displayMessage(data.name, data.text);
  });
}

// [기능 2] 메시지 전송
function sendMsg() {
  const textInput = document.getElementById('msgInput');
  const text = textInput.value;
  if(text.trim() === "") return;

  // 파이어베이스 데이터베이스로 전송!
  db.ref("messages").push({
    name: myName,
    text: text,
    timestamp: Date.now()
  });
  
  // 전송 후 입력창 비우기
  textInput.value = "";
}

// [기능 3] 화면에 말풍선 그리기
function displayMessage(name, text) {
  const log = document.getElementById('log');
  const msgDiv = document.createElement('div');
  
  // 내가 보낸 건 노란색 우측, 남이 보낸 건 흰색 좌측
  msgDiv.className = 'msg ' + (name === myName ? 'my-msg' : 'other-msg');
  
  // 다른 사람이 보낸 거면 이름표 달아주기
  if (name !== myName) {
    const nameDiv = document.createElement('div');
    nameDiv.className = 'sender';
    nameDiv.innerText = name;
    msgDiv.appendChild(nameDiv);
  }
  
  const textDiv = document.createElement('div');
  textDiv.innerText = text;
  msgDiv.appendChild(textDiv);
  
  log.appendChild(msgDiv);
  log.scrollTop = log.scrollHeight; // 새 메시지 오면 자동으로 맨 밑으로 스크롤
}

// [기능 4] 화상통화 카메라 켜기
let localStream;
async function startVideoCall() { 
    try {
        // 스마트폰 카메라 권한 요청
        localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('videoUI').style.display = 'block';
    } catch (e) {
        alert("카메라 및 마이크 권한이 필요합니다. 브라우저 설정에서 허용해 주세요.");
    }
}

// [기능 5] 통화 종료
function endCall() { 
    document.getElementById('videoUI').style.display = 'none';
    if(localStream) {
        localStream.getTracks().forEach(track => track.stop()); // 카메라 불빛 끄기
    }
}
</script>
</body>
</html>
